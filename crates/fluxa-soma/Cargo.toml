[package]
name = "fluxa-soma"
version = "0.1.0"
edition = "2021"
description = "Native Fluxa soma — egui/WGPU chat + IPC (palier 2.0)"

[[bin]]
name = "fluxa-soma"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", default-features = true, features = ["wgpu"] }
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
env_logger = "0.11"
